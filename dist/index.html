<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<style>
:root {
  --background:#ffffff;
  --foreground:#0a0a0a;
  --card:#ffffff;
  --card-foreground:#0a0a0a;
  --popover:#ffffff;
  --popover-foreground:#0a0a0a;
  --primary:#171717;
  --primary-foreground:#fafafa;
  --secondary:#f5f5f5;
  --secondary-foreground:#0a0a0a;
  --muted:#f5f5f5;
  --muted-foreground:#737373;
  --accent:#f5f5f5;
  --accent-foreground:#171717;
  --destructive:#dc2626;
  --destructive-foreground:#fafafa;
  --border:#e5e5e5;
  --input:#e5e5e5;
  --ring:#737373;
  --chart-1:#5eb1ef;

  --radius-sm:4px;
  --radius-md:6px;
  --radius-lg:8px;
  --radius-xl:12px;

  --font-sans:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background:#0a0a0a;
    --foreground:#fafafa;
    --card:#171717;
    --card-foreground:#fafafa;
    --popover:#262626;
    --popover-foreground:#fafafa;
    --primary:#e5e5e5;
    --primary-foreground:#171717;
    --secondary:#262626;
    --secondary-foreground:#fafafa;
    --muted:#262626;
    --muted-foreground:#a3a3a3;
    --accent:#404040;
    --accent-foreground:#fafafa;
    --destructive:#f87171;
    --destructive-foreground:#171717;
    --border:#404040;
    --input:#171717;
    --ring:#737373;
    --chart-1:#5eb1ef;
  }
}
:root[data-theme="dark"] {
  --background:#0a0a0a;
  --foreground:#fafafa;
  --card:#171717;
  --card-foreground:#fafafa;
  --popover:#262626;
  --popover-foreground:#fafafa;
  --primary:#e5e5e5;
  --primary-foreground:#171717;
  --secondary:#262626;
  --secondary-foreground:#fafafa;
  --muted:#262626;
  --muted-foreground:#a3a3a3;
  --accent:#404040;
  --accent-foreground:#fafafa;
  --destructive:#f87171;
  --destructive-foreground:#171717;
  --border:#404040;
  --input:#171717;
  --ring:#737373;
  --chart-1:#5eb1ef;
}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app {
  max-width: 1040px;
  margin: 0 auto;
  padding: 32px 24px 80px;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}
.wordmark {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 15px;
  color: var(--foreground);
}
.tabs {
  display: inline-flex;
  padding: 3px;
  background: var(--muted);
  border-radius: var(--radius-lg);
  gap: 2px;
}
.tab {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--muted-foreground);
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.tab:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.tab[data-active="true"] {
  background: var(--card);
  color: var(--card-foreground);
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
}
.screen { display: none; }
.screen[data-active="true"] { display: block; }

/* ---------- primitives ---------- */
.card {
  background: var(--card);
  color: var(--card-foreground);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
}
.btn {
  appearance: none;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 36px;
  padding: 0 14px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease, opacity .15s ease;
  white-space: nowrap;
}
.btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn-primary { background: var(--primary); color: var(--primary-foreground); }
.btn-primary:hover { opacity: .88; }
.btn-secondary { background: var(--secondary); color: var(--secondary-foreground); }
.btn-secondary:hover { background: var(--accent); }
.btn-outline { background: transparent; color: var(--foreground); border-color: var(--border); }
.btn-outline:hover { background: var(--accent); }
.btn-ghost { background: transparent; color: var(--muted-foreground); }
.btn-ghost:hover { background: var(--accent); color: var(--accent-foreground); }
.btn-destructive-ghost { background: transparent; color: var(--muted-foreground); }
.btn-destructive-ghost:hover { background: var(--destructive); color: var(--destructive-foreground); }
.btn-sm { height: 30px; padding: 0 10px; font-size: 12px; }
.btn-icon { width: 36px; padding: 0; }
.btn-link { background: transparent; border: none; color: var(--muted-foreground); font-size: 12px; height: auto; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.btn-link:hover { color: var(--foreground); }

.field-label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted-foreground);
  margin-bottom: 6px;
}
.input {
  width: 100%;
  height: 36px;
  padding: 0 12px;
  background: var(--background);
  color: var(--foreground);
  border: 1px solid var(--input);
  border-radius: var(--radius-md);
  font-family: var(--font-sans);
  font-size: 13px;
}
.input::placeholder { color: var(--muted-foreground); }
.input:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0 8px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
}
.badge-tag { background: var(--secondary); color: var(--secondary-foreground); }
.badge-muted { background: transparent; color: var(--muted-foreground); border: 1px solid var(--border); }
.badge-warn { background: transparent; color: var(--destructive); border: 1px solid var(--destructive); }

/* ---------- screen 1: timer ---------- */
.timer-layout { max-width: 560px; margin: 0 auto; }
.timer-card { padding: 32px; }
.rec-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 500; color: var(--muted-foreground);
  text-transform: uppercase; letter-spacing: .04em;
  margin-bottom: 18px;
}
.rec-dot {
  width: 7px; height: 7px; border-radius: 999px;
  background: var(--chart-1);
  animation: pulse 1.8s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) { .rec-dot { animation: none; } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.timer-display {
  font-size: 52px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-bottom: 20px;
}

.idle-view { display: flex; flex-direction: column; align-items: center; padding: 64px 0 32px; }
.timer-card.is-idle { border-color: transparent; background: transparent; }
.btn-play-big { height: 44px; padding: 0 28px; font-size: 14px; }
.btn-play-big svg { width: 16px; height: 16px; }

/* ---------- save button: three-state motion (idle → saving → saved) ---------- */
.save-btn-wrap { position: relative; }
canvas.save-burst { position: absolute; width: 240px; height: 240px; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; }
#saveBtn { position: relative; transition: background .15s ease, opacity .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1); }
#saveBtn.is-saving { transform: scale(1.05); }
.save-icon-slot { position: relative; width: 15px; height: 15px; flex: none; }
.save-icon-slot svg { position: absolute; inset: 0; width: 15px; height: 15px; transition: opacity .18s ease, transform .22s cubic-bezier(.34,1.56,.64,1); }
.save-icon-square { opacity: 1; transform: scale(1) rotate(0deg); }
.save-icon-clock, .save-icon-check { opacity: 0; transform: scale(.4) rotate(-20deg); }
#saveBtn.is-saving .save-icon-square { opacity: 0; transform: scale(.4) rotate(20deg); }
#saveBtn.is-saving .save-icon-clock { opacity: 1; transform: scale(1) rotate(0deg); }
#saveBtn.is-saved .save-icon-square { opacity: 0; transform: scale(.4) rotate(20deg); }
#saveBtn.is-saved .save-icon-clock { opacity: 0; transform: scale(.4) rotate(20deg); }
#saveBtn.is-saved .save-icon-check { opacity: 1; transform: scale(1) rotate(0deg); }
@keyframes spinHandMin { to { transform: rotate(360deg); } }
@keyframes spinHandHr { to { transform: rotate(360deg); } }
.save-icon-clock line { transform-origin: 12px 12px; transform-box: view-box; }
#saveBtn.is-saving .save-hand-min { animation: spinHandMin .5s linear infinite; }
#saveBtn.is-saving .save-hand-hr { animation: spinHandHr 1.6s linear infinite; }

.save-label { position: relative; display: inline-grid; }
.save-label span { grid-area: 1 / 1; transition: opacity .16s ease, transform .2s ease; white-space: nowrap; }
.save-label-idle { opacity: 1; transform: translateY(0); }
.save-label-saving, .save-label-saved { opacity: 0; transform: translateY(6px); }
#saveBtn.is-saving .save-label-idle { opacity: 0; transform: translateY(-6px); }
#saveBtn.is-saving .save-label-saving { opacity: 1; transform: translateY(0); }
#saveBtn.is-saved .save-label-saving { opacity: 0; transform: translateY(-6px); }
#saveBtn.is-saved .save-label-saved { opacity: 1; transform: translateY(0); }

@media (prefers-reduced-motion: reduce) {
  #saveBtn, .save-icon-slot svg, .save-label span { transition-duration: .01ms !important; }
  .save-hand-min, .save-hand-hr { animation: none !important; }
}

.title-input {
  width: 100%;
  border: none;
  background: transparent;
  font-family: var(--font-sans);
  font-size: 18px;
  font-weight: 500;
  color: var(--foreground);
  padding: 0;
  margin-bottom: 26px;
}
.title-input::placeholder { color: var(--muted-foreground); font-weight: 400; }
.title-input:focus-visible { outline: none; }

.field-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 14px;
  margin-bottom: 26px;
}

.controls-row {
  display: flex; align-items: center; gap: 8px;
  margin-top: 30px;
}
.controls-row .spacer { flex: 1; }

.discard-confirm {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  background: var(--muted);
  border-radius: var(--radius-md);
  font-size: 12px;
  color: var(--foreground);
  flex-wrap: wrap;
}
.discard-confirm strong { font-weight: 600; }
.discard-confirm-actions { display: flex; gap: 8px; margin-left: auto; flex: none; }

.section-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--muted-foreground);
  margin: 40px 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.day-summary { font-weight: 500; color: var(--foreground); text-transform: none; letter-spacing: 0; font-size: 12px; }
.day-panel-actions { display: flex; align-items: center; gap: 12px; }
.day-panel-actions .btn-sm { height: 26px; padding: 0 10px; font-size: 12px; text-transform: none; letter-spacing: 0; }

.entry-list { display: flex; flex-direction: column; gap: 18px; }
.entry-row {
  display: flex; align-items: center; gap: 12px;
}
.entry-main { flex: 1; min-width: 0; }
.entry-title { font-size: 13px; font-weight: 500; color: var(--foreground); margin-bottom: 4px; }
.entry-meta { display: flex; align-items: center; gap: 6px; }
.entry-time { font-size: 13px; color: var(--muted-foreground); flex: none; text-align: right; white-space: nowrap; }
.entry-money { font-size: 13px; font-weight: 500; width: 84px; text-align: right; flex: none; }
.entry-money.muted { color: var(--muted-foreground); font-weight: 400; }
.entry-money.warn { color: var(--destructive); font-weight: 400; }

.row-edit-btn {
  width: 28px; height: 28px; flex: none;
  border: 1px solid var(--border); background: var(--background);
  border-radius: var(--radius-sm);
  color: var(--muted-foreground);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.row-edit-btn svg { width: 14px; height: 14px; }
.row-edit-btn:hover { background: var(--accent); color: var(--accent-foreground); }
.row-edit-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.row-edit-delete:hover { background: var(--destructive); color: var(--destructive-foreground); }

.entry-edit-card {
  display: flex; flex-direction: column; gap: 10px;
  padding: 14px; background: var(--muted); border-radius: var(--radius-lg);
}
.entry-edit-title-line {
  width: 100%; border: none; background: transparent;
  font-family: var(--font-sans); font-size: 14px; font-weight: 500;
  color: var(--foreground); padding: 0;
}
.entry-edit-title-line::placeholder { color: var(--muted-foreground); font-weight: 400; }
.entry-edit-title-line:focus-visible { outline: none; }
.entry-edit-fields { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.entry-edit-fields .input { height: 32px; font-size: 12.5px; padding: 0 10px; }
.entry-edit-fields .combo-trigger { height: 32px; font-size: 12.5px; padding: 0 10px; }
.date-field { position: relative; }
.date-field .input { padding-right: 30px; }
.date-cal-btn {
  position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border: none; background: transparent;
  color: var(--muted-foreground); border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.date-cal-btn svg { width: 14px; height: 14px; }
.date-cal-btn:hover { background: var(--accent); color: var(--accent-foreground); }
.date-cal-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.entry-edit-date { width: 144px; flex: none; }
.entry-edit-date .tag-popover { width: 220px; padding: 10px; }
.entry-edit-time-range { display: flex; align-items: center; gap: 6px; }
.entry-edit-time { width: 92px; flex: none; }
.entry-edit-time-sep { color: var(--muted-foreground); font-size: 12px; }
.entry-edit-tag { width: 128px; flex: none; }
.entry-edit-rate { flex: 1 1 104px; min-width: 90px; }
.entry-edit-actions { display: flex; gap: 6px; margin-left: auto; }

.empty-state {
  padding: 28px 4px;
  color: var(--muted-foreground);
  font-size: 13px;
  text-align: center;
}

/* ---------- screen 2: history ---------- */
.history-toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 28px;
}
.btn.period-trigger { width: auto; padding: 0 12px; gap: 8px; }
.search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 280px; }
.search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--muted-foreground); }
.search-wrap .input { padding-left: 32px; }
.combo-wrap { position: relative; }
.combo-trigger { width: 100%; justify-content: space-between; }
.combo-trigger span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.btn.combo-trigger svg { width: 13px; height: 13px; color: var(--muted-foreground); flex: none; }
.btn.tag-trigger { width: auto; padding: 0 12px; gap: 8px; }
.tag-popover {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
  width: 232px; padding: 8px;
  background: var(--popover); color: var(--popover-foreground);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: 0 12px 32px rgba(0,0,0,.16);
}
.tag-popover .input { height: 32px; font-size: 12px; margin-bottom: 6px; }
.tag-options { display: flex; flex-direction: column; max-height: 216px; overflow-y: auto; gap: 1px; }
.period-custom-box { display: block; }
.tag-option {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px; border-radius: var(--radius-sm);
  font-size: 13px; cursor: pointer; user-select: none;
}
.tag-option:hover { background: var(--accent); }
.tag-option input { width: 14px; height: 14px; accent-color: var(--primary); flex: none; }
.tag-option-add { color: var(--foreground); font-weight: 500; margin-top: 2px; }
.tag-option-add svg { width: 14px; height: 14px; flex: none; color: var(--muted-foreground); }
.tag-check-slot { width: 14px; height: 14px; flex: none; display: inline-flex; color: var(--foreground); }
.tag-empty { padding: 10px 8px; font-size: 12px; color: var(--muted-foreground); }
.tag-option-label { flex: 1; min-width: 0; display: inline-flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.tag-option-delete {
  flex: none; width: 22px; height: 22px; padding: 0; border: none; border-radius: var(--radius-sm);
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; color: var(--muted-foreground); opacity: 0; cursor: pointer;
  transition: opacity .1s, background .1s, color .1s;
}
.tag-option-delete svg { width: 13px; height: 13px; }
.tag-option:hover .tag-option-delete { opacity: 1; }
.tag-option-delete:hover { background: var(--destructive); color: var(--destructive-foreground); }
.tag-options .discard-confirm { padding: 7px 8px; font-size: 12px; }
.tag-options .discard-confirm-actions .btn-sm { height: 24px; padding: 0 8px; font-size: 11px; }

.history-body {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  column-gap: 20px;
  row-gap: 36px;
}
.stat-tile { padding: 20px 20px; }
.stat-label { font-size: 12px; color: var(--muted-foreground); margin-bottom: 8px; }
.stat-value { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
.stat-value.accent { color: var(--chart-1); }

.cal-card { grid-column: span 1; }
.day-panel { grid-column: span 2; }
@media (max-width: 760px) {
  .history-body { grid-template-columns: 1fr; }
  .cal-card, .day-panel { grid-column: 1 / -1; }
}
@media (max-width: 420px) {
  .field-grid { grid-template-columns: 1fr; }
  .entry-edit-date, .entry-edit-tag { width: 100%; }
}

.search-group { margin-bottom: 26px; }
.search-group:last-child { margin-bottom: 0; }
.search-date {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted-foreground); margin-bottom: 10px;
}
.search-empty { padding: 40px 0; text-align: center; font-size: 13px; color: var(--muted-foreground); }

.cal-card { padding: 14px; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-nav .month-label { font-size: 12.5px; font-weight: 600; }
.cal-nav-btns { display: flex; gap: 4px; }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 2px; }
.cal-weekdays span { font-size: 10px; font-weight: 500; color: var(--muted-foreground); text-align: center; padding: 3px 0; }
.cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-day {
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px;
  cursor: pointer;
  font-family: var(--font-sans);
  color: var(--foreground);
  min-width: 0;
}
.cal-day:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.cal-day .num { font-size: 10.5px; font-weight: 500; }
.cal-day .hrs { font-size: 8.5px; font-weight: 600; color: var(--chart-1); }
.cal-day[data-muted="true"] { color: var(--muted-foreground); }
.cal-day[data-muted="true"] .num { color: var(--muted-foreground); }
.cal-day[data-today="true"] { border-color: var(--chart-1); }
.cal-day[data-selected="true"] { background: var(--primary); }
.cal-day[data-selected="true"] .num { color: var(--primary-foreground); }
.cal-day[data-selected="true"] .hrs { color: var(--primary-foreground); opacity: .75; }
.cal-day[data-inrange="true"] { background: rgba(94, 177, 239, 0.18); border-radius: 0; }
.cal-day:not([data-selected="true"]):hover { background: var(--accent); }

.period-back { align-self: flex-start; height: 22px; padding: 0 4px; font-size: 11px; gap: 4px; margin-bottom: 2px; }
.period-back svg { width: 12px; height: 12px; }
.period-apply { width: 100%; margin-top: 8px; }
</style>

<div class="app">
  <div class="topbar">
    <div class="wordmark">Time Tracker</div>
    <div class="tabs">
      <button class="tab" data-screen-tab="timer" data-active="true" onclick="showScreen('timer')">Таймер</button>
      <button class="tab" data-screen-tab="history" onclick="showScreen('history')">История</button>
    </div>
  </div>

  <!-- ===================== SCREEN 1 — TIMER ===================== -->
  <section class="screen" data-screen="timer" data-active="true">
    <div class="timer-layout">
      <div class="card timer-card is-idle" id="timerCard">

<script>
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(function(s){ s.dataset.active = (s.dataset.screen === name) ? 'true' : 'false'; });
  document.querySelectorAll('.tab').forEach(function(t){ t.dataset.active = (t.dataset.screenTab === name) ? 'true' : 'false'; });
}

var timerState = 'idle'; // idle | running
var paused = false, seconds = 0;
function fmt(s) {
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  function p(n){ return (n<10?'0':'')+n; }
  return p(h)+':'+p(m)+':'+p(sec);
}
function tick() {
  if (timerState === 'running' && !paused) {
    seconds++;
    document.getElementById('timerDisplay').textContent = fmt(seconds);
  }
}
setInterval(tick, 1000);

var tagLastRate = {};
function updateRateForTag(tag) {
  var input = document.getElementById('rateInput');
  if (input) input.value = tag ? (tagLastRate[tag] || '') : '';
}

var currentEntryDefaultTitle = '';
function defaultEntryTitle() {
  var d = new Date();
  return 'Без названия — ' + pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + ', ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function startTimer() {
  timerState = 'running';
  seconds = 0;
  paused = false;
  document.getElementById('timerCard').classList.remove('is-idle');
  document.getElementById('idleView').style.display = 'none';
  document.getElementById('runningView').style.display = '';
  document.getElementById('timerDisplay').textContent = fmt(0);
  currentEntryDefaultTitle = defaultEntryTitle();
  document.getElementById('titleInput').placeholder = currentEntryDefaultTitle;
  document.getElementById('titleInput').value = '';
  document.getElementById('recRow').style.opacity = '1';
  currentProjectTag = null;
  document.getElementById('projectTriggerLabel').textContent = currentProjectTag || 'Без тега';
  updateRateForTag(currentProjectTag);
}
function resetToIdle() {
  timerState = 'idle';
  paused = false;
  seconds = 0;
  document.getElementById('timerCard').classList.add('is-idle');
  document.getElementById('runningView').style.display = 'none';
  document.getElementById('idleView').style.display = '';
  document.getElementById('discardArea').innerHTML = '';
  document.getElementById('controlsRow').style.display = 'flex';
  document.getElementById('pauseBtn').innerHTML =
    '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>Пауза';
}
function saveEntry() {
  var titleInput = document.getElementById('titleInput');
  var titleVal = titleInput.value.trim() || currentEntryDefaultTitle || defaultEntryTitle();
  var rateVal = document.getElementById('rateInput').value.trim();
  if (rateVal && currentProjectTag) tagLastRate[currentProjectTag] = rateVal;

  var now = new Date();
  var startD = new Date(now.getTime() - seconds * 1000);
  var startStr = pad2(startD.getHours()) + ':' + pad2(startD.getMinutes());
  var endStr = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  var durH = seconds / 3600;
  var money = rateVal ? formatMoney(Math.round(durH * (parseInt(rateVal.replace(/\D/g, ''), 10) || 0))) : null;
  var entry = {
    title: titleVal,
    tag: currentProjectTag || 'Без тега',
    time: startStr + '–' + endStr,
    start: startStr,
    end: endStr,
    date: TODAY_KEY,
    rate: rateVal || null,
    money: money
  };

  playSaveAnimation(function () {
    if (!dayDetails[TODAY_KEY]) dayDetails[TODAY_KEY] = { date: dayHeading(TODAY_KEY), total: '', entries: [] };
    dayDetails[TODAY_KEY].entries.push(entry);
    recomputeDayTotal(TODAY_KEY);
    buildCalendar();
    if (currentDateKey === TODAY_KEY) renderDay(TODAY_KEY);
    updateStats();
  });
}

/* ---- save button motion: particle burst + clock→check morph ---- */
var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var saveBurstCanvas = document.getElementById('saveBurst');
var saveBurstCtx = saveBurstCanvas.getContext('2d');
var saveBurstDpr = Math.min(window.devicePixelRatio || 1, 2);
saveBurstCanvas.width = 240 * saveBurstDpr;
saveBurstCanvas.height = 240 * saveBurstDpr;
saveBurstCtx.scale(saveBurstDpr, saveBurstDpr);

function saveBurstColor() {
  return getComputedStyle(document.documentElement).getPropertyValue('--foreground').trim() || '#0a0a0a';
}
function spawnSaveBurst() {
  var color = saveBurstColor();
  var particles = [];
  var count = 22;
  for (var i = 0; i < count; i++) {
    var angle = (Math.PI * 2 * i) / count + (Math.random() - .5) * .4;
    var speed = 1.4 + Math.random() * 2.2;
    particles.push({ x: 120, y: 120, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - .6, r: 1.2 + Math.random() * 2, life: 1, decay: .02 + Math.random() * .018, color: color });
  }
  (function run() {
    saveBurstCtx.clearRect(0, 0, 240, 240);
    var alive = false;
    particles.forEach(function (p) {
      if (p.life <= 0) return;
      alive = true;
      p.x += p.vx; p.y += p.vy; p.vy += .06; p.vx *= .98; p.life -= p.decay;
      saveBurstCtx.beginPath(); saveBurstCtx.globalAlpha = Math.max(p.life, 0); saveBurstCtx.fillStyle = p.color;
      saveBurstCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2); saveBurstCtx.fill();
    });
    saveBurstCtx.globalAlpha = 1;
    if (alive) requestAnimationFrame(run); else saveBurstCtx.clearRect(0, 0, 240, 240);
  })();
}

var saveTimers = [];
function clearSaveTimers() { saveTimers.forEach(clearTimeout); saveTimers = []; }
function playSaveAnimation(onSaved) {
  var btn = document.getElementById('saveBtn');
  clearSaveTimers();
  btn.classList.remove('is-saved', 'is-saving');
  void btn.offsetWidth;
  btn.classList.add('is-saving');
  if (!reduceMotion) spawnSaveBurst();

  saveTimers.push(setTimeout(function () {
    btn.classList.remove('is-saving');
    btn.classList.add('is-saved');
    onSaved();
  }, reduceMotion ? 40 : 480));

  saveTimers.push(setTimeout(function () {
    btn.classList.remove('is-saved');
    withMorph(resetToIdle);
  }, reduceMotion ? 500 : 1500));
}

/* ---- timer card morph: idle button ↔ running card via Web Animations API ---- */
var morphBusy = false;
var MORPH_EASE = 'cubic-bezier(.4,0,.2,1)';
function currentVisibleView() {
  var runningEl = document.getElementById('runningView');
  return runningEl.style.display === 'none' ? document.getElementById('idleView') : runningEl;
}
function raceFinished(anim, fallbackMs) {
  return Promise.race([
    anim.finished.catch(function () {}),
    new Promise(function (resolve) { setTimeout(resolve, fallbackMs); })
  ]);
}
function supportsAnimate() {
  return typeof Element !== 'undefined' && typeof Element.prototype.animate === 'function';
}
function withMorph(mutateFn) {
  if (morphBusy) return;
  if (reduceMotion || !supportsAnimate()) { mutateFn(); return; }
  morphBusy = true;

  var card = document.getElementById('timerCard');
  var outgoing = currentVisibleView();
  var startH = card.getBoundingClientRect().height;

  var fadeOut = outgoing.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, easing: 'ease', fill: 'forwards' });

  raceFinished(fadeOut, 200).then(function () {
    mutateFn();
    var incoming = currentVisibleView();
    var endH = card.getBoundingClientRect().height;

    card.style.overflow = 'hidden';
    incoming.style.opacity = '0';

    var heightAnim = card.animate(
      [{ height: startH + 'px' }, { height: endH + 'px' }],
      { duration: 380, easing: MORPH_EASE, fill: 'forwards' }
    );
    var fadeIn = incoming.animate(
      [{ opacity: 0 }, { opacity: 0 }, { opacity: 1 }],
      { duration: 320, easing: 'ease', fill: 'forwards' }
    );

    heightAnim.finished.then(finish, finish);
    setTimeout(finish, 700);

    var done = false;
    function finish() {
      if (done) return;
      done = true;
      heightAnim.cancel();
      fadeIn.cancel();
      card.style.height = '';
      card.style.overflow = '';
      outgoing.style.opacity = '';
      incoming.style.opacity = '';
      morphBusy = false;
    }
  });
}
function togglePause() {
  paused = !paused;
  var btn = document.getElementById('pauseBtn');
  btn.innerHTML = paused
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>Продолжить'
    : '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>Пауза';
  document.getElementById('recRow').style.opacity = paused ? '.5' : '1';
}
function showDiscardConfirm() {
  document.getElementById('controlsRow').style.display = 'none';
  document.getElementById('discardArea').innerHTML =
    '<div class="discard-confirm"><span>Сбросить текущую запись? <strong>' + fmt(seconds).replace(/^00:/,'') + '</strong> пропадёт без сохранения.</span>' +
    '<div class="discard-confirm-actions">' +
      '<button class="btn btn-sm btn-destructive-ghost" onclick="withMorph(resetToIdle)">Да, сбросить</button>' +
      '<button class="btn btn-sm btn-outline" onclick="hideDiscardConfirm()">Отмена</button>' +
    '</div></div>';
}
function hideDiscardConfirm() {
  document.getElementById('controlsRow').style.display = 'flex';
  document.getElementById('discardArea').innerHTML = '';
}

/* ---- icons ---- */
var PENCIL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
var CLOSE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>';
var TRASH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>';
var PLUS_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>';
var CAL_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
var CHEVRON_LEFT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
var CHEVRON_RIGHT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
var CHEVRON_DOWN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

/* ---- date utilities (shared by sidebar calendar, entry date-field, period picker) ---- */
var MONTH_NAMES = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var MONTH_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONTH_SHORT_GEN = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function isoDate(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); }
var _now = new Date();
var TODAY_Y = _now.getFullYear(), TODAY_M = _now.getMonth(), TODAY_D = _now.getDate();
var TODAY_KEY = isoDate(TODAY_Y, TODAY_M, TODAY_D);
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function firstWeekdayMon(y, m) { return (new Date(y, m, 1).getDay() + 6) % 7; }
function monthGridCells(y, m) {
  var firstWd = firstWeekdayMon(y, m);
  var total = daysInMonth(y, m);
  var prevY = m === 0 ? y - 1 : y, prevM = m === 0 ? 11 : m - 1;
  var prevTotal = daysInMonth(prevY, prevM);
  var cells = [];
  for (var i = firstWd; i > 0; i--) cells.push({ num: prevTotal - i + 1, muted: true });
  for (var d = 1; d <= total; d++) cells.push({ num: d, muted: false, key: isoDate(y, m, d) });
  var rem = (7 - (cells.length % 7)) % 7;
  for (var t = 1; t <= rem; t++) cells.push({ num: t, muted: true });
  return cells;
}
function dayHeading(dateKey) {
  var p = dateKey.split('-');
  return parseInt(p[2], 10) + ' ' + MONTH_GEN[parseInt(p[1], 10) - 1];
}
function formatShortDate(dateKey) {
  var p = dateKey.split('-');
  return parseInt(p[2], 10) + ' ' + MONTH_SHORT_GEN[parseInt(p[1], 10) - 1];
}

/* ---- entry-edit date field: typeable text + calendar popover, own month/year per instance ---- */
var datePickerYear = {}, datePickerMonth = {}, datePickerDay = {};
function formatDateInput(y, m, d) { return pad2(d) + '.' + pad2(m + 1) + '.' + y; }
function dateFieldHtml(idBase, y, m, d) {
  datePickerYear[idBase] = y; datePickerMonth[idBase] = m; datePickerDay[idBase] = d;
  return '<div class="combo-wrap date-field entry-edit-date">' +
    '<input type="text" class="input" id="et-date-' + idBase + '" value="' + formatDateInput(y, m, d) + '" placeholder="ДД.ММ.ГГГГ" inputmode="numeric" oninput="parseTypedDate(\'' + idBase + '\', this.value)">' +
    '<button type="button" class="date-cal-btn" onclick="toggleDatePopover(\'' + idBase + '\', event)" title="Открыть календарь">' + CAL_ICON_SVG + '</button>' +
    '<div class="tag-popover" id="datePop-' + idBase + '" style="display:none">' +
      '<div class="cal-nav" style="margin-bottom:6px">' +
        '<button type="button" class="btn btn-icon btn-ghost btn-sm" onclick="navDatePicker(\'' + idBase + '\',-1)">' + CHEVRON_LEFT_SVG + '</button>' +
        '<div class="month-label" id="dateMonthLabel-' + idBase + '">' + MONTH_NAMES[m] + ' ' + y + '</div>' +
        '<button type="button" class="btn btn-icon btn-ghost btn-sm" onclick="navDatePicker(\'' + idBase + '\',1)">' + CHEVRON_RIGHT_SVG + '</button>' +
      '</div>' +
      '<div class="cal-weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>' +
      '<div class="cal-days" id="dateDays-' + idBase + '"></div>' +
    '</div>' +
  '</div>';
}
function parseTypedDate(idBase, value) {
  var m = value.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (m) {
    var d = parseInt(m[1], 10), mo = parseInt(m[2], 10) - 1, y = parseInt(m[3], 10);
    if (d >= 1 && d <= 31 && mo >= 0 && mo <= 11) { datePickerDay[idBase] = d; datePickerMonth[idBase] = mo; datePickerYear[idBase] = y; }

/* ---- time / money helpers ---- */
function timeToMinutes(t) { var p = (t || '0:0').split(':'); return (+p[0] || 0) * 60 + (+p[1] || 0); }
function durationHours(start, end) { var d = (timeToMinutes(end) - timeToMinutes(start)) / 60; return d > 0 ? Math.round(d * 100) / 100 : 0; }
function parseMoney(m) { return m ? (parseInt(String(m).replace(/\D/g, ''), 10) || 0) : 0; }
function formatMoney(n) { return n ? n.toLocaleString('ru-RU') + ' ₽' : null; }
function recomputeDayTotal(dateKey) {
  var d = dayDetails[dateKey];
  if (!d) return;
  if (!d.entries.length) { d.total = ''; delete calData[dateKey]; saveState(); return; }
  var totalH = 0, totalM = 0;
  d.entries.forEach(function(e){
    var parts = (e.time || '–').split('–');
    var s = e.start || (parts[0] || '').trim();
    var en = e.end || (parts[1] || '').trim();
    totalH += durationHours(s, en);
    totalM += parseMoney(e.money);
  });
  totalH = Math.round(totalH * 10) / 10;
  d.total = totalM ? totalH + 'ч · ' + formatMoney(totalM) : totalH + 'ч';
  calData[dateKey] = totalH;
  saveState();
}
var STORAGE_KEY = 'timeTrackerData_v1';
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      dayDetails: dayDetails,
      calData: calData,
      allTags: allTags,
      tagLastRate: tagLastRate
    }));
  } catch (err) { /* storage unavailable or full — nothing else to do */ }
}
function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    var data = JSON.parse(raw);
    if (data.dayDetails) dayDetails = data.dayDetails;
    if (data.calData) calData = data.calData;
    if (data.allTags) allTags = data.allTags;
    if (data.tagLastRate) tagLastRate = data.tagLastRate;
  } catch (err) { /* corrupted data — start fresh rather than crash */ }
}

  }).join('');
  var html = noneRow + rows;
  if (filterStr && !tagExists(filterStr)) {
    html += '<div class="tag-option tag-option-add" onclick="createAndSelectProject(\'' + jsEsc(filterStr) + '\')">' + PLUS_SVG + 'Добавить «' + escHtml(filterStr) + '»</div>';
  } else if (!rows && !noneRow) {
    html = '<div class="tag-empty">Тегов пока нет</div>';
  }
  document.getElementById('projectOptions').innerHTML = html;
}
function selectProject(t) {
  currentProjectTag = t;
  document.getElementById('projectTriggerLabel').textContent = t || 'Без тега';
  document.getElementById('projectPopover').style.display = 'none';
  updateRateForTag(t);
}
function createAndSelectProject(name) {
  name = name.trim();
  if (!name) return;
  if (!tagExists(name)) { allTags.push(name); saveState(); }
  selectProject(name);
}

/* ---- period picker ---- */
function weekdayOfMon(y, m, d) { return (new Date(y, m, d).getDay() + 6) % 7; }
function addDaysKey(key, delta) {
  var p = key.split('-').map(Number);
  var dt = new Date(p[0], p[1] - 1, p[2] + delta);
  return isoDate(dt.getFullYear(), dt.getMonth(), dt.getDate());
}
var WEEK_DOW = weekdayOfMon(TODAY_Y, TODAY_M, TODAY_D);
var WEEK_START_KEY = addDaysKey(TODAY_KEY, -WEEK_DOW);
var WEEK_END_KEY = addDaysKey(WEEK_START_KEY, 6);
var MONTH_START_KEY = isoDate(TODAY_Y, TODAY_M, 1);
var MONTH_END_KEY = isoDate(TODAY_Y, TODAY_M, daysInMonth(TODAY_Y, TODAY_M));
var LAST_MONTH_IDX = TODAY_M === 0 ? 11 : TODAY_M - 1;
var LAST_MONTH_YEAR = TODAY_M === 0 ? TODAY_Y - 1 : TODAY_Y;
var LAST_MONTH_START_KEY = isoDate(LAST_MONTH_YEAR, LAST_MONTH_IDX, 1);
var LAST_MONTH_END_KEY = isoDate(LAST_MONTH_YEAR, LAST_MONTH_IDX, daysInMonth(LAST_MONTH_YEAR, LAST_MONTH_IDX));
var LAST30_START_KEY = addDaysKey(TODAY_KEY, -29);
var periodPresets = [
  { label: 'Сегодня', start: TODAY_KEY, end: TODAY_KEY },
  { label: 'Эта неделя', start: WEEK_START_KEY, end: WEEK_END_KEY },
  { label: 'Этот месяц', start: MONTH_START_KEY, end: MONTH_END_KEY },
  { label: 'Прошлый месяц', start: LAST_MONTH_START_KEY, end: LAST_MONTH_END_KEY },
  { label: 'Последние 30 дней', start: LAST30_START_KEY, end: TODAY_KEY }
];
function presetRangeLabel(p) {
  return p.start === p.end ? formatShortDate(p.start) : formatShortDate(p.start) + ' – ' + formatShortDate(p.end);
}
var currentPeriodStart = periodPresets[4].start, currentPeriodEnd = periodPresets[4].end;
var currentPeriodRange = presetRangeLabel(periodPresets[4]);
document.getElementById('periodLabel').textContent = currentPeriodRange;
updateStats();
var periodMode = 'presets'; // 'presets' | 'custom'
var customRangeStartKey = null;
var customRangeEndKey = null;
var periodCalYear = TODAY_Y, periodCalMonth = TODAY_M;

/* ---- stats for the selected period ---- */
function computeStatsForRange(startKey, endKey) {
  var activeTags = Object.keys(selectedTags).filter(function(t){ return selectedTags[t]; });
  var totalH = 0, totalM = 0, count = 0;
  Object.keys(dayDetails).forEach(function(key){
    if (key < startKey || key > endKey) return;
    dayDetails[key].entries.forEach(function(e){
      if (activeTags.length && activeTags.indexOf(e.tag) === -1) return;
      var parts = (e.time || '–').split('–');
      var s = e.start || (parts[0] || '').trim();
      var en = e.end || (parts[1] || '').trim();
      totalH += durationHours(s, en);
      totalM += parseMoney(e.money);
      count++;
    });
  });
  return { hours: Math.round(totalH * 10) / 10, money: totalM, count: count };
}
function updateStats() {
  var stats = computeStatsForRange(currentPeriodStart, currentPeriodEnd);
  document.getElementById('statHours').textContent = stats.hours + 'ч';
  document.getElementById('statMoney').textContent = (stats.money ? stats.money.toLocaleString('ru-RU') : '0') + ' ₽';
  document.getElementById('statCount').textContent = stats.count;
}

function togglePeriodPopover(e) {
  e.stopPropagation();
  var pop = document.getElementById('periodPopover');
  var willOpen = pop.style.display === 'none';
  closeOtherPopovers('periodPopover');
  pop.style.display = willOpen ? 'block' : 'none';
  if (willOpen) { periodMode = 'presets'; renderPeriodOptions(); }
}
function isCustomActive() {
  return !periodPresets.some(function(p){ return p.start === currentPeriodStart && p.end === currentPeriodEnd; });
}
function renderPeriodOptions() {
  var box = document.getElementById('periodOptions');
  if (periodMode === 'custom') {
    box.className = 'period-custom-box';
    box.innerHTML =
      '<button type="button" class="btn btn-ghost btn-sm period-back" onclick="backToPresets()">' + CHEVRON_LEFT_SVG + 'Пресеты</button>' +
      '<div class="cal-nav" style="margin:6px 0">' +
        '<button type="button" class="btn btn-icon btn-ghost btn-sm" onclick="navPeriodCalMonth(-1)">' + CHEVRON_LEFT_SVG + '</button>' +
        '<div class="month-label" id="periodMonthLabel">' + MONTH_NAMES[periodCalMonth] + ' ' + periodCalYear + '</div>' +
        '<button type="button" class="btn btn-icon btn-ghost btn-sm" onclick="navPeriodCalMonth(1)">' + CHEVRON_RIGHT_SVG + '</button>' +
      '</div>' +
      '<div class="cal-weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>' +
      '<div class="cal-days" id="periodCalDays"></div>' +
      '<button type="button" class="btn btn-primary btn-sm period-apply" id="periodApplyBtn" onclick="applyCustomRange()">Применить</button>';
    buildCustomRangeCalendar();
    return;
  }
  box.className = 'tag-options';
  var rows = periodPresets.map(function(p, idx){
    var active = p.start === currentPeriodStart && p.end === currentPeriodEnd;
    return '<div class="tag-option" onclick="selectPreset(' + idx + ')">' +
      '<span class="tag-check-slot">' + (active ? CHECK_SVG : '') + '</span>' + escHtml(p.label) + '</div>';
  }).join('');
  rows += '<div class="tag-option" onclick="openCustomRange()">' +
    '<span class="tag-check-slot">' + (isCustomActive() ? CHECK_SVG : '') + '</span>Свой период →</div>';
  box.innerHTML = rows;
}
function selectPreset(idx) {
  var p = periodPresets[idx];
  selectPeriod(p.start, p.end, presetRangeLabel(p));
}
function openCustomRange() {
  periodMode = 'custom';
  if (isCustomActive()) {
    customRangeStartKey = currentPeriodStart;
    customRangeEndKey = currentPeriodEnd;
  } else {
    customRangeStartKey = null; customRangeEndKey = null;
  }
  var anchor = customRangeStartKey || isoDate(TODAY_Y, TODAY_M, TODAY_D);
  var ap = anchor.split('-');
  periodCalYear = parseInt(ap[0], 10);
  periodCalMonth = parseInt(ap[1], 10) - 1;
  renderPeriodOptions();
}
function backToPresets() {
  periodMode = 'presets';
  renderPeriodOptions();
}
function navPeriodCalMonth(delta) {
  periodCalMonth += delta;
  if (periodCalMonth < 0) { periodCalMonth = 11; periodCalYear--; }
  else if (periodCalMonth > 11) { periodCalMonth = 0; periodCalYear++; }
  document.getElementById('periodMonthLabel').textContent = MONTH_NAMES[periodCalMonth] + ' ' + periodCalYear;
  buildCustomRangeCalendar();
}
function buildCustomRangeCalendar() {
  var container = document.getElementById('periodCalDays');
  var cells = monthGridCells(periodCalYear, periodCalMonth);
  var lo = customRangeStartKey && customRangeEndKey ? (customRangeStartKey < customRangeEndKey ? customRangeStartKey : customRangeEndKey) : null;
  var hi = customRangeStartKey && customRangeEndKey ? (customRangeStartKey < customRangeEndKey ? customRangeEndKey : customRangeStartKey) : null;
  container.innerHTML = cells.map(function(c){
    var isEndpoint = !c.muted && (c.key === customRangeStartKey || c.key === customRangeEndKey);
    var inRange = !c.muted && lo && !isEndpoint && c.key > lo && c.key < hi;
    return '<button type="button" class="cal-day" data-muted="' + c.muted + '" data-selected="' + isEndpoint + '" data-inrange="' + inRange + '"' +
      (!c.muted ? ' onclick="pickRangeDay(\'' + c.key + '\')"' : '') + '>' +
      '<span class="num">' + c.num + '</span></button>';
  }).join('');
}
function pickRangeDay(key) {
  if (!customRangeStartKey || customRangeEndKey) {
    customRangeStartKey = key;
    customRangeEndKey = null;
  } else if (key < customRangeStartKey) {
    customRangeEndKey = customRangeStartKey;
    customRangeStartKey = key;
  } else {
    customRangeEndKey = key;
  }
  buildCustomRangeCalendar();
}
function applyCustomRange() {
  if (!customRangeStartKey) return;
  var endKey = customRangeEndKey || customRangeStartKey;
  var label = endKey !== customRangeStartKey
    ? formatShortDate(customRangeStartKey) + ' – ' + formatShortDate(endKey)
    : formatShortDate(customRangeStartKey);
  selectPeriod(customRangeStartKey, endKey, label);
}
function selectPeriod(startKey, endKey, range) {
  currentPeriodStart = startKey;
  currentPeriodEnd = endKey;
  currentPeriodRange = range;
  document.getElementById('periodLabel').textContent = range;
  document.getElementById('periodPopover').style.display = 'none';
  periodMode = 'presets';
  updateStats();
}
document.addEventListener('click', function(e){
  // composedPath (not contains()) because some option clicks replace their own
  // parent's innerHTML — that detaches e.target from the tree before this
  // bubbles here, and contains() would then wrongly say "clicked outside".
  var path = e.composedPath ? e.composedPath() : [e.target];
  document.querySelectorAll('.combo-wrap').forEach(function(wrap){
    if (path.indexOf(wrap) === -1) {
      var pop = wrap.querySelector('.tag-popover');
      if (pop) pop.style.display = 'none';
    }
  });
});

/* ---- search (over real dayDetails, newest day first) ---- */
function handleSearch(query) {
  query = query.trim().toLowerCase();
  var grid = document.getElementById('historyGrid');
  var results = document.getElementById('searchResults');
  if (!query) {
    grid.style.display = '';
    results.style.display = 'none';
    return;
  }
  grid.style.display = 'none';
  results.style.display = 'block';
  renderSearchResults(query);
}
function renderSearchResults(query) {
  var el = document.getElementById('searchResults');
  var dateKeys = Object.keys(dayDetails).sort().reverse();
  var groups = [];
  dateKeys.forEach(function(key){
    var matches = dayDetails[key].entries.filter(function(e){ return e.title.toLowerCase().indexOf(query) !== -1; });
    if (matches.length) groups.push({ key: key, entries: matches });
  });
  if (!groups.length) {
    el.innerHTML = '<div class="search-empty">Ничего не найдено по «' + escHtml(query) + '»</div>';
    return;
  }
  el.innerHTML = groups.map(function(g){
    var rows = g.entries.map(function(e){ return displayRowHtml(e, null, 0); }).join('');
    return '<div class="search-group"><div class="search-date">' + dayHeading(g.key) + '</div><div class="entry-list">' + rows + '</div></div>';
  }).join('');
}

/* ---- restore saved data on launch ---- */
loadState();
buildCalendar();
renderDay(currentDateKey);
updateStats();
</script>
